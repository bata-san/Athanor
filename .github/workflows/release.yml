name: Release

# Builds the installers, publishes a GitHub release and refreshes the auto-update feed.
# Run it manually (Actions -> Release -> Run workflow) after bumping the version in Cargo.toml and
# app/src-tauri/tauri.conf.json; the tag must be "v" + that version.
#
# Needs the repository secret TAURI_SIGNING_PRIVATE_KEY (the updater signing key; its public half is in
# tauri.conf.json -> plugins.updater.pubkey). The feed is the `latest.json` asset of the rolling release tagged
# `updater` (a fixed URL that also works while releases are marked pre-release).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.1.1 (must match the app version)
        required: true
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Check the tag matches the app version
        shell: bash
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          if [ "v$version" != "${{ inputs.tag }}" ]; then echo "tag ${{ inputs.tag }} does not match app version $version"; exit 1; fi
      - working-directory: app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npx tauri build --bundles nsis
      - name: Write the update feed entry
        shell: bash
        run: |
          installer=$(ls target/release/bundle/nsis/*-setup.exe | head -n1)
          name=$(basename "$installer")
          node -e '
            const fs = require("fs");
            const [name, tag] = process.argv.slice(1);
            const signature = fs.readFileSync(`target/release/bundle/nsis/${name}.sig`, "utf8").trim();
            const feed = {
              version: tag.replace(/^v/, ""),
              notes: `Athanor ${tag}`,
              pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature, url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/${name}` } },
            };
            fs.writeFileSync("latest.json", JSON.stringify(feed, null, 2));
          ' "$name" "${{ inputs.tag }}"
          cat latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: athanor-windows
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*-setup.exe.sig
            latest.json

  macos:
    name: macOS (${{ matrix.target }}, unsigned)
    runs-on: macos-latest
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_TARGET: ${{ matrix.target }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Check release version
        run: node -e 'if (process.env.RELEASE_TAG !== "v" + require("./app/src-tauri/tauri.conf.json").version) process.exit(1)'
      - name: Build application, disk image and updater archive
        working-directory: app
        run: |
          npm ci
          npx tauri build --target "$RELEASE_TARGET" --bundles app,dmg -- --locked
      - name: Prepare macOS assets and feed fragment
        run: node tools/macos-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: athanor-${{ matrix.target }}
          path: release-assets/*

  android:
    name: Android APK (unsigned)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006" "platforms;android-36" "build-tools;36.0.0"
      - working-directory: app
        run: |
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          npm ci
          npx tauri android build --target aarch64 --apk
      - uses: actions/upload-artifact@v4
        with:
          name: athanor-android
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk

  publish:
    name: Publish release and update feed
    needs: [windows, android, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect installers and merge platform feeds
        run: node tools/collect-release.mjs
      - name: Create the release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          flags=""
          if [ "$RELEASE_PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$RELEASE_TAG" $flags --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Athanor $RELEASE_TAG" --generate-notes release-assets/*
      - name: Refresh the update feed
        run: |
          gh release view updater --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create updater --repo "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
              --title "Update feed" --notes "Rolling release that holds latest.json for the in-app updater. Do not delete."
          gh release upload updater latest.json --clobber --repo "$GITHUB_REPOSITORY"
