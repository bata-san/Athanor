[package]
name = "athanor"
description = "Athanor - a lightweight Chromium-based browser"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "athanor"

[lib]
name = "athanor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable", "devtools", "image-png"] }
athanor-core = { path = "../../crates/athanor-core" }
athanor-ext = { path = "../../crates/athanor-ext" }
athanor-adblock = { path = "../../crates/athanor-adblock" }
percent-encoding = "2"
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
url.workspace = true
base64 = "0.22"
log = "0.4"
ureq = "2"
imagesize = "0.13"
tokio = { version = "1", features = ["time", "sync", "net", "io-util", "rt", "macros"] }
tauri-plugin-dialog = "2"

[target.'cfg(windows)'.dependencies]
athanor-import = { path = "../../crates/athanor-import" }
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_UI_Input_KeyboardAndMouse", "Win32_System_Com", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
