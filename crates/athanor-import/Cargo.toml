[package]
name = "athanor-import"
description = "Read bookmarks and history from other browsers (Chromium family, Firefox, HTML export). Pure: no UI or engine dependencies."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# bundled: no system SQLite needed on Windows
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
