[package]
name = "athanor-adblock"
description = "Content blocking for Athanor, built on Brave's adblock-rust engine."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
adblock = { version = "0.13", default-features = false, features = ["embedded-domain-resolver", "full-regex-handling"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
parking_lot.workspace = true
url.workspace = true
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
